services:
 db:
   image: postgres:17
   ports:
     - "5432:5432"
   volumes:
     - postgres_data:/var/lib/postgresql/data
   env_file:
     - .env

 django-web:
   build: .
   container_name: django-docker
   depends_on:
    - db
   volumes:
    - ./static:/app/staticfiles
   env_file:
    - .env

 nginx:
  image: nginx:latest
  ports:
    - "80:80"
    - "443:443"
  volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf:ro
    - ./static:/static:ro
    - web-root:/var/www/html
    - certbot-etc:/etc/letsencrypt
    - certbot-var:/var/lib/letsencrypt
    - dhparam:/etc/ssl/certs
  depends_on:
    - django-web

 certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - web-root:/var/www/html
    depends_on:
      - nginx
    command: certonly --webroot --webroot-path=/var/www/html --email aahmed@outlook.com --agree-tos --no-eff-email --force-renewal -d paegex.com -d www.paegex.com
volumes:
  postgres_data:
  certbot-etc:
  certbot-var:
  web-root:
    driver: local
    driver_opts:
      type: none
      device: /home/paegex/paegex/static/
      o: bind
  dhparam:
    driver: local
    driver_opts:
      type: none
      device: /home/paegex/paegex/dhparam/
      o: bind

networks:
  app-network:
    driver: bridg
