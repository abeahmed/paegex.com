events {
   worker_connections 1024;
}

http {
   include mime.types;
   default_type application/octet-stream;
   sendfile on;
   keepalive_timeout 65;

   server {
       listen 80;

       location ~ /.well-known/acme-challenge {
           allow all;
           root /var/www/html;
       }

         location / {
                rewrite ^ https://$host$request_uri? permanent;
        }
   }

   server {

       listen 443 ssl http2;
       listen [::]:443 ssl http2;
       server_name paegex.com www.paegex.com;

       server_tokens off;

       ssl_certificate /etc/letsencrypt/live/paegex.com/fullchain.pem;       
       ssl_certificate_key /etc/letsencrypt/live/paegex.com/privkey.pem;

       ssl_buffer_size 8k;

       ssl_dhparam /etc/ssl/certs/dhparam-2048.pem;

       ssl_protocols TLSv1.2;
       ssl_prefer_server_ciphers on;

       ssl_ciphers ECDH+AESGCM:ECDH+AES256:ECDH+AES128:DH+3DES:!ADH:!AECDH:!MD5;

       ssl_ecdh_curve secp384r1;
       ssl_session_tickets off;

       ssl_stapling on;
       ssl_stapling_verify on;
       resolver 8.8.8.8;


       location /static/ {
           alias /static/;
           expires 7d;
       }

  
       location / {
    
           proxy_pass http://django-web:8000;

           proxy_set_header Host $host;                          # Original host header
           proxy_set_header X-Real-IP $remote_addr;             # Client's real IP
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Chain of IP addresses
           proxy_set_header X-Forwarded-Proto $scheme;          # Original protocol (http/https)
       }
     
      
   }
}
