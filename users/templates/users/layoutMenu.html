<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="/static/styles.css">   
    <body>
    {% if user.is_authenticated %}
        <header>
            <div class="container">
                <img src="/static/Paegex.svg" class="logo" style="width: 90px;"/>
                <div class="hamburger">
                    <div class="line"></div>
                    <div class="line"></div>
                    <div class="line"></div>
                </div>

                <nav>
                    <ul>
                        <li><a href="{% url 'home' %}">Home</a></li>
                        <li><a href="{% url 'index' %}">Appointments</a></li>
                        <li><a href="{% url 'appointmentIndex' %}">Patients</a></li>
                        <li><a href="{% url 'about' %}">About</a></li>
                        <li><a href="{% url 'logoutPage' %}">Logout</a></li>   
                    </ul>
                </nav>
            </div>
        </header> 
    {% elif not user.is_authenticated %}
        <header>
            <div class="container">
                <img src="/static/Paegex.svg" class="logo" style="width: 90px;"/>
                <div class="hamburger">
                    <div class="line"></div>
                    <div class="line"></div>
                    <div class="line"></div>
                </div>

                <nav>
                    <ul>
                        <li><a href="{% url 'home' %}">Home</a></li>
                        <li><a href="{% url 'about' %}">About</a></li>
                        <li><a href="{% url 'loginPage' %}">Login</a></li>   
                    </ul>
                </nav>
            </div>
        </header> 
    {% endif %}
        {% block body %}
        {% endblock %}

        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const hamburger = document.querySelector('.hamburger');
                const nav = document.querySelector('nav');
                
                hamburger.onclick = function() {
                    nav.classList.toggle('active');
                    hamburger.classList.toggle('active');
                }
            });
        </script>
    </body>
</html>
